[package]
name = "simhark-firmware-runner"
version = "0.1.0"
edition = "2024"
publish = false
build = "build.rs"

[workspace]

[dependencies]
simhark = { path = "../..", features = ["realistic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
