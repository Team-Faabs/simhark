[package]
name = "match-runner"
version = "0.1.0"
edition = "2024"
description = "Run RoboCup SSL AI vs AI matches in simhark with scoring and SSL-log output"
license = "GPL-3.0"

[lib]
name = "match_runner"
path = "src/lib.rs"

# Binaries are auto-discovered from src/bin/ (match-sim, bench).

[dependencies]
simhark = { path = "../.." }
simhark_faabs = { path = "../simhark_faabs", optional = true }
simhark-sumatra = { path = "../simhark-sumatra", optional = true }
loguna = { git = "https://github.com/Technulgy-LGNU/loguna" }
core_dump = { git = "https://github.com/Technulgy-LGNU/core-dump" }
referris = { git = "https://github.com/Technulgy-LGNU/referris", default-features = false, optional = true }
anyhow = "1.0"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
webinterface-assets = { git = "https://github.com/Technulgy-LGNU/interfaabs" }
webinterface-core = { git = "https://github.com/Technulgy-LGNU/interfaabs" }
webinterface-protocol = { git = "https://github.com/Technulgy-LGNU/interfaabs" }
webinterface-dehumanized-schema = { git = "https://github.com/Technulgy-LGNU/interfaabs", optional = true }

bangka = { path = "../../../bangka/bangka", optional = true }
bongka = { path = "../../../bangka/bongka", optional = true }
ungabunga = { path = "../../../bangka/ungabunga", optional = true }
dehumanized = { path = "../../../dehumanized", optional = true }

[features]
default = ["bangka", "bongka", "ungabunga", "dehumanized", "sim-time"]
all = [
  "bangka",
  "bongka",
  "ungabunga",
  "dehumanized",
  "viewer-debug",
  "sim-time",
  "sumatra",
  "validator",
]
faabs = ["dep:simhark_faabs"]
bangka = ["faabs", "dep:bangka"]
bongka = ["faabs", "dep:bongka"]
ungabunga = ["faabs", "dep:ungabunga"]
dehumanized = ["dep:dehumanized"]
viewer = ["simhark/viewer", "simhark_faabs?/viewer", "dep:webinterface-dehumanized-schema"]
viewer-debug = ["viewer", "simhark/viewer-debug", "simhark_faabs?/viewer-debug"]
sim-time = ["faabs", "simhark_faabs/sim-time"]
sumatra = ["dep:simhark-sumatra"]
referris = ["dep:referris", "referris/webinterface"]
validator = ["referris"]
