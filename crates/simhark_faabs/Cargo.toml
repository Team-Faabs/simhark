[package]
name = "simhark_faabs"
version = "0.1.0"
edition = "2024"

[dependencies]
simhark = { path = "../.." }
simhark_testing = { path = "../simhark_testing", optional = true }
crashpilot = { git = "https://github.com/Technulgy-LGNU/CrashPilot" }
tf_jetsoncode = { git = "https://github.com/Technulgy-LGNU/teamfaabs-ssl-robot-code" }
referris-simhark = { git = "https://github.com/Technulgy-LGNU/referris" }
referris = { git = "https://github.com/Technulgy-LGNU/referris" }
core_dump = { git = "https://github.com/Technulgy-LGNU/core-dump" }
tokio = { version = "1.52.3", optional = true }
tokio-tungstenite = { version = "0.29.0", optional = true }
futures-util = { version = "0.3.32", optional = true }
prost = { version = "0.14.3", optional = true }
socket2 = { version = "0.6.4", optional = true }
webinterface-core = { git = "https://github.com/Technulgy-LGNU/CrashPilot-Interface", rev = "e1df0dad5177b37451ad987914e740ad16c93661", optional = true }
webinterface-crashpilot-bridge = { git = "https://github.com/Technulgy-LGNU/CrashPilot-Interface", rev = "e1df0dad5177b37451ad987914e740ad16c93661", optional = true }
webinterface-protocol = { git = "https://github.com/Technulgy-LGNU/CrashPilot-Interface", rev = "e1df0dad5177b37451ad987914e740ad16c93661", optional = true }

[features]
default = []
viewer = [
  "simhark_testing/viewer",
  "dep:tokio",
  "dep:prost",
  "dep:webinterface-core",
  "dep:webinterface-crashpilot-bridge",
  "dep:webinterface-protocol",
]
viewer-debug = ["viewer", "simhark/viewer-debug", "crashpilot/viewer-debug"]
interface = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:prost", "crashpilot/interface"]
ssl_game_controller = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:prost", "dep:socket2", "crashpilot/ssl_game_controller"]
testing = ["dep:simhark_testing"]
sim-time = ["crashpilot/sim-time"]

[[bin]]
name = "goalie_tests"
path = "src/bin/goalie_tests.rs"
required-features = ["testing"]
