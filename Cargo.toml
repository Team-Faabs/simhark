[package]
name = "simhark"
version = "0.1.0"
edition = "2024"
description = "A high-performance parallel RoboCup SSL simulator inspired by grSim"
license = "GPL-3.0"

[workspace]
members = [
    "crates/simhark-sumatra",
    "crates/simhark_faabs",
    "crates/simhark_testing",
]
resolver = "2"

[features]
default = []
viewer = ["dep:tiny_http", "dep:tungstenite"]
viewer-debug = ["viewer"]
motion-audit = []

[lib]
name = "simhark"
path = "src/lib.rs"

[[bin]]
name = "simhark"
path = "src/main.rs"

[[bin]]
name = "simhark-replay"
path = "src/bin/simhark-replay.rs"
required-features = ["viewer"]

[dependencies]
rayon = "1.10"
nalgebra = "0.34.2"
rapier3d = { version = "0.32.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.11"
rand = "0.10.0"
rand_chacha = "0.10.0"
parking_lot = "0.12"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
prost = "0.14.3"
prost-types = "0.14.3"
tiny_http = { version = "0.12", optional = true }
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"], optional = true }
loguna = { path = "../loguna/loguna" }

[dev-dependencies]
anyhow = "1.0"
criterion = { version = "0.8.2", features = ["html_reports"] }
approx = "0.5"
ctrlc = "3.5"
referris = { git = "https://github.com/Technulgy-LGNU/referris", default-features = false }
simhark-sumatra = { path = "crates/simhark-sumatra" }
simhark_testing = { path = "crates/simhark_testing", features = ["viewer"] }

[build-dependencies]
prost-build = "0.13"

[[bench]]
name = "simulation"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[example]]
name = "sumatra-selfplay"
path = "examples/sumatra_selfplay.rs"
required-features = ["viewer"]

[[example]]
name = "sumatra-selfplay-two-worlds"
path = "examples/sumatra_selfplay_two_worlds.rs"

[[example]]
name = "sumatra-blue-scores"
path = "examples/sumatra_blue_scores.rs"

[[example]]
name = "testing-viewer"
path = "examples/testing_viewer.rs"
required-features = ["viewer"]
